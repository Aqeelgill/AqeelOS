<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Workspace | AqeelOS</title>
  <link rel="stylesheet" href="/static/vendor/fonts/inter.css">
  <style>
    :root{--bg:#0a0a0a;--card:#1a1a2e;--card2:#20203a;--border:rgba(255,255,255,.08);--text:#f8fafc;--muted:#94a3b8;--accent:#00d4ff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
    [data-theme="light"]{--bg:#f3f6fb;--card:#fff;--card2:#f8fafc;--border:rgba(15,23,42,.08);--text:#0f172a;--muted:#64748b}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
    .stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
    .online{background:rgba(34,197,94,.14);color:var(--ok)} .offline{background:rgba(148,163,184,.14);color:var(--muted)} .busy{background:rgba(245,158,11,.14);color:var(--warn)}
    .item{padding:12px 0;border-bottom:1px solid var(--border)} .item:last-child{border-bottom:0} .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
    .btn,a.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card2);color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:600;cursor:pointer}
    .btn.primary{background:var(--accent);color:#001018;border-color:transparent}
    .muted{color:var(--muted);font-size:13px}
    @media (max-width:900px){.grid,.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div><h1 id="name" style="margin:0;font-size:28px">Agent Workspace</h1><div class="muted" id="sub">Loading workspace...</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="themeBtn" onclick="toggleTheme()">Theme</button><a class="btn" href="/dashboard">Back to Dashboard</a></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div><div class="muted" id="dept">Department</div><h2 id="task" style="margin:8px 0 0;font-size:20px">Current task</h2></div>
        <span class="badge offline" id="status">offline</span>
      </div>
      <div class="grid">
        <div class="stat"><b id="done">0</b><span>Tasks completed</span></div>
        <div class="stat"><b id="today">0</b><span>Completed today</span></div>
        <div class="stat"><b id="rate">0%</b><span>Success rate</span></div>
        <div class="stat"><b id="last">—</b><span>Last active</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="toggleBtn" onclick="toggleAgent()">Toggle Status</button><a class="btn" href="/quick-assign">Assign via CEO Dashboard</a></div>
    </div>
    <div class="split" style="margin-top:16px">
      <div class="card"><h3 style="margin:0 0 10px">Recent Tasks</h3><div id="tasks" class="muted">Loading...</div></div>
      <div class="card"><h3 style="margin:0 0 10px">Recent Activity</h3><div id="activity" class="muted">Loading...</div></div>
    </div>
  </div>
  <script>
    const API_BASE = window.location.origin;
    const agentId = location.pathname.split('/').filter(Boolean).pop();
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmt(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?String(iso).replace('T',' ').slice(0,19):d.toLocaleString(); }
    function setTheme(theme){ document.documentElement.dataset.theme=theme; localStorage.setItem('aqeelos_theme',theme); document.getElementById('themeBtn').textContent=theme==='dark'?'Light':'Dark'; }
    function toggleTheme(){ setTheme((localStorage.getItem('aqeelos_theme')||'dark')==='dark'?'light':'dark'); }
    let csrf=null; async function getCsrf(){ if(csrf) return csrf; try{csrf=(await (await fetch(API_BASE+'/api/csrf',{credentials:'same-origin'})).json()).csrf_token;}catch(e){} return csrf; }
    async function api(path, opts){ opts=opts||{}; const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{}); const m=(opts.method||'GET').toUpperCase(); if(!['GET','HEAD','OPTIONS'].includes(m)){ const t=await getCsrf(); if(t) headers['X-CSRF-Token']=t; } const res=await fetch(API_BASE+path,Object.assign({credentials:'same-origin'},opts,{headers})); const ct=res.headers.get('X-CSRF-Token'); if(ct) csrf=ct; const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error||('Request failed')); return data; }
    async function load(){
      try{
        const data = await api('/api/agents/'+encodeURIComponent(agentId));
        const a=data.agent||{};
        document.title = a.name + ' | AqeelOS';
        name.textContent=a.name||'Agent Workspace'; sub.textContent='Workspace connected to '+API_BASE; dept.textContent=a.department_id||'Department'; task.textContent=a.current_task||'Ready';
        status.textContent=a.status||'offline'; status.className='badge '+(a.status||'offline');
        done.textContent=a.tasks_completed||0; today.textContent=a.tasks_completed_today||0; rate.textContent=Number(a.success_rate||0).toFixed(1)+'%'; last.textContent=fmt(a.last_active);
        toggleBtn.textContent = a.status==='offline' ? 'Go Online' : 'Go Offline';
        tasks.innerHTML = (data.tasks||[]).map(t=>`<div class="item"><div class="meta">${esc(fmt(t.created_at))} · ${esc(t.status)}</div><div>${esc(t.task)}</div></div>`).join('') || '<div class="muted">No tasks assigned.</div>';
        activity.innerHTML = (data.activity||[]).map(x=>`<div class="item"><div class="meta">${esc(fmt(x.timestamp))}</div><div><strong>${esc(x.action)}</strong> — ${esc(x.details)}</div></div>`).join('') || '<div class="muted">No activity recorded.</div>';
      }catch(e){ sub.textContent='Unable to load workspace: '+e.message; }
    }
    async function toggleAgent(){ try{ await api('/api/agents/'+encodeURIComponent(agentId)+'/toggle',{method:'POST'}); await load(); }catch(e){ sub.textContent=e.message; } }
    setTheme(localStorage.getItem('aqeelos_theme')||'dark'); load(); setInterval(load, 5000);
  </script>
</body>
</html>
