<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Register | AqeelOS</title>
<link rel="stylesheet" href="/static/vendor/fonts/inter.css"><link rel="stylesheet" href="/static/css/base.css"></head>
<body><div class="topbar"><a class="btn" href="/">Home</a><div><a class="btn" href="/login">Login</a> <button class="btn" onclick="UI.toggleTheme()">Theme</button></div></div>
<div class="container" style="max-width:520px"><div class="card" style="padding:22px"><h1 style="margin-top:0">Create Client Account</h1><p class="muted">Register to hire public AI agents through the CEO Bot.</p>
<form id="f" class="grid" style="gap:10px"><input class="input" name="name" placeholder="Full name" required autocomplete="name"><input class="input" name="email" type="email" placeholder="Email" required autocomplete="email"><input class="input" name="password" type="password" placeholder="Password (min 6 chars)" minlength="6" required autocomplete="new-password"><button class="btn primary" type="submit">Register</button></form>
<div id="msg" class="notice muted" style="margin-top:12px">Local account stored in SQLite.</div></div></div>
<script src="/static/js/api.js"></script><script>
f.onsubmit=async(e)=>{e.preventDefault(); msg.textContent='Creating account...'; try{const fd=new FormData(f); await API.post('/api/auth/register',{name:fd.get('name'),email:fd.get('email'),password:fd.get('password')}); location.href='/client';}catch(err){msg.textContent=err.message||'Registration failed';}}
</script></body></html>
